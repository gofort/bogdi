baseurl: https://bogdi.xyz
locale: en-us
theme: hugo-theme-stack
pagination:
    pagerSize: 5
title: "CDN Test Website"
enableGitInfo: true

# Theme i18n support
# Available values: en, fr, id, ja, ko, pt-br, zh-cn
DefaultContentLanguage: en

permalinks:
    post: /post/:slug/
    page: /:slug/

params:
    mainSections:
        - post
    rssFullContent: true
    # favicon:

    footer:
        since: 2020
        # customText:

    dateFormat:
        published: Jan 02, 2006
        lastUpdated: Jan 02, 2006 15:04 MST

    sidebar:
        avatar: img/avatar.jpg

    article:
        math: false
        toc: true
        license:
            enabled: true
            default: Licensed under CC BY-NC-SA 4.0

    comments:
        enabled: false

    widgets:
        enabled:
            - search
            - archives
            - tag-cloud

        archives:
            limit: 5

        tagCloud:
            limit: 10

    opengraph:
        twitter:
            # Your Twitter username
            # site:

            # Available values: summary, summary_large_image
            card: summary_large_image

    colorScheme:
        # Display toggle
        toggle: true

        # Available values: auto, light, dark
        default: auto

    imageProcessing:
        thumbnail:
            enabled: true
        content:
            enabled: true

menu:
    main:
        - identifier: home
          name: Home
          url: /
          weight: -100
          params:
              icon: home

        - identifier: about
          name: About
          url: /about
          weight: -90
          params:
              icon: user

        - identifier: archives
          name: Archives
          url: /archives
          weight: -70
          params:
              icon: archives

        - identifier: search
          name: Search
          url: /search
          weight: -60
          params:
              icon: search

    social:
        - identifier: github
          name: GitHub
          url: https://github.com/gofort
          params:
              icon: brand-github

        - identifier: linkedin
          name: Linkedin
          url: https://www.linkedin.com/in/bogdan-kurnosov/
          params:
              icon: brand-linkedin

related:
    includeNewer: true
    threshold: 60
    toLower: false
    indices:
        - name: tags
          weight: 100

        - name: categories
          weight: 200

markup:
    highlight:
        noClasses: false

services:
    googleAnalytics:
        id: G-KDMWML0KMV
